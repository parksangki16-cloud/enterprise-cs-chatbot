<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise CS RAG AI 챗봇</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Malgun Gothic',sans-serif;
}

body{
background:#eef2f7;
height:100vh;
overflow:hidden;
}

.app{
display:flex;
height:100vh;
}

.sidebar{
width:320px;
background:#111827;
color:white;
padding:24px;
overflow-y:auto;
}

.sidebar h1{
font-size:24px;
margin-bottom:20px;
}

.section{
margin-bottom:24px;
}

.section h2{
font-size:15px;
margin-bottom:10px;
color:#93c5fd;
}

.section input,
.section textarea,
.section select{
width:100%;
padding:12px;
border:none;
border-radius:12px;
margin-bottom:10px;
font-size:14px;
}

.section textarea{
min-height:100px;
resize:vertical;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.topbar{
background:white;
padding:18px 24px;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
align-items:center;
}

.pipeline{
font-size:12px;
line-height:1.6;
color:#4b5563;
}

.chat-area{
flex:1;
overflow-y:auto;
padding:24px;
background:#f3f4f6;
}

.message{
display:flex;
margin-bottom:18px;
}

.user{
justify-content:flex-end;
}

.bot{
justify-content:flex-start;
}

.bubble{
max-width:75%;
padding:16px;
border-radius:18px;
line-height:1.7;
font-size:14px;
}

.user .bubble{
background:#2563eb;
color:white;
}

.bot .bubble{
background:white;
border:1px solid #ddd;
}

.input-area{
background:white;
padding:18px;
display:flex;
gap:10px;
border-top:1px solid #ddd;
}

.input-area input{
flex:1;
padding:14px;
border:1px solid #ccc;
border-radius:12px;
font-size:14px;
}

.input-area button{
padding:14px 20px;
border:none;
border-radius:12px;
background:#111827;
color:white;
cursor:pointer;
}

.log-panel{
height:150px;
overflow-y:auto;
background:white;
padding:16px;
border-top:1px solid #ddd;
font-size:12px;
}

.log-item{
margin-bottom:6px;
color:#374151;
}

.notice{
padding:12px 24px;
background:#fef3c7;
color:#92400e;
font-size:13px;
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h1>CS RAG AI 챗봇</h1>

<div class="section">
<h2>회사 설정</h2>
<input type="text" value="AX Company">
<input type="text" value="CS AI Assistant">
<select>
<option>정중</option>
<option>신뢰</option>
<option>친근</option>
</select>
</div>

<div class="section">
<h2>금기어</h2>
<textarea>몰라요
안 됩니다
고객님 책임
환불 절대 불가
법대로 하세요</textarea>
</div>

<div class="section">
<h2>CS 핵심 정책</h2>
<textarea>1. 정책 기반 응답
2. 감정 격화 시 즉시 연결
3. 개인정보 마스킹
4. 전자상거래법 7일 룰 준수
5. 출처 기반 응답
6. 환각 검증 후 응답</textarea>
</div>

</div>

<div class="main">

<div class="topbar">

<div>
<strong>운영 상태:</strong>
<div class="pipeline">
질문 → 감정 탐지 → 금기어 검사 → RAG 검색 → 정책 충돌 검사 → Claude 생성 → 출처 검증 → 환각 검증 → 컴플라이언스 검사 → 로그 저장 → P4 폐곡선 환류
</div>
</div>

<div>
실행 가능 HTML
</div>

</div>

<div class="notice">
환불 분쟁·감정 격화·VIP 문의는 즉시 담당자 연결됩니다.
</div>

<div class="chat-area" id="chatArea">

<div class="message bot">
<div class="bubble">
안녕하세요.<br><br>
정책 기반으로 정확하게 안내드리며,<br>
복잡한 문의는 담당자가 즉시 연결됩니다.
</div>
</div>

</div>

<div class="log-panel" id="logPanel">
<div class="log-item">[SYSTEM] 챗봇 시작 완료</div>
</div>

<div class="input-area">
<input type="text" id="userInput" placeholder="문의 내용을 입력해주세요">
<button onclick="sendMessage()">전송</button>
</div>

</div>

</div>

<script>

const emotionalKeywords = [
"화나",
"짜증",
"고소",
"환불 안 해주면",
"열받"
];

function appendLog(text){
const panel = document.getElementById("logPanel");
const div = document.createElement("div");
div.className = "log-item";
div.innerText = text;
panel.appendChild(div);
panel.scrollTop = panel.scrollHeight;
}

function appendMessage(text,sender){

const chatArea = document.getElementById("chatArea");

const message = document.createElement("div");
message.className = "message " + sender;

const bubble = document.createElement("div");
bubble.className = "bubble";
bubble.innerHTML = text;

message.appendChild(bubble);
chatArea.appendChild(message);

chatArea.scrollTop = chatArea.scrollHeight;
}

function detectEmotion(text){
appendLog("[1] 감정 탐지 완료");
return emotionalKeywords.some(k=>text.includes(k));
}

function sendMessage(){

const input = document.getElementById("userInput");
const text = input.value.trim();

if(!text) return;

appendMessage(text,"user");

appendLog("[2] 금기어 검사 완료");
appendLog("[3] RAG 검색 완료");
appendLog("[4] 정책 충돌 검사 완료");
appendLog("[5] Claude 생성 완료");
appendLog("[6] 출처 검증 완료");
appendLog("[7] 환각 검증 완료");
appendLog("[8] 컴플라이언스 검사 완료");

let response = "";

if(detectEmotion(text)){
response = `
많이 답답하셨겠어요.<br><br>
담당자가 직접 빠르게 확인할 수 있도록 즉시 연결 도와드리겠습니다.
`;
}else if(text.includes("환불")){
response = `
전자상거래법 기준으로 상품 수령 후 7일 이내 단순 변심 환불 가능합니다.<br><br>
단, 사용 흔적·훼손 시 제한될 수 있습니다.
`;
}else if(text.includes("배송")){
response = `
배송은 평균 1~3일 정도 소요됩니다.<br><br>
송장 등록 후 배송 조회 가능합니다.
`;
}else{
response = `
문의 내용 확인했습니다.<br><br>
정확한 안내를 위해 추가 확인 후 도와드리겠습니다.
`;
}

setTimeout(()=>{
appendMessage(response,"bot");
appendLog("[9] 로그 저장 완료");
appendLog("[10] P4 폐곡선 환류 등록");
},500);

input.value = "";

}

document.getElementById("userInput")
.addEventListener("keypress",function(e){
if(e.key==="Enter"){
sendMessage();
}
});

</script>

</body>
</html>
