<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Malgun Gothic',sans-serif;}
body{background:#f1f5f9;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

header{background:#1e293b;padding:14px 24px;display:flex;align-items:center;gap:12px;}
header .logo{font-size:17px;font-weight:700;color:white;}
header .sub{font-size:12px;color:#94a3b8;margin-left:4px;}
.online{display:flex;align-items:center;gap:6px;font-size:12px;color:#22c55e;margin-left:auto;}
.dot{width:7px;height:7px;background:#22c55e;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.btn-engine{background:#6366f1;color:white;padding:6px 14px;border-radius:6px;text-decoration:none;font-size:12px;font-weight:600;margin-left:12px;}

.layout{display:flex;flex:1;overflow:hidden;}

/* Chat */
.chat-panel{flex:1;display:flex;flex-direction:column;}
.notice-bar{background:#fef3c7;color:#92400e;font-size:12px;padding:8px 20px;border-bottom:1px solid #fde68a;}

.messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;}

.msg{display:flex;gap:10px;max-width:85%;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg.bot{align-self:flex-start;}

.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.bot .avatar{background:#1e293b;color:white;}
.user .avatar{background:#6366f1;color:white;}

.bubble{padding:13px 16px;border-radius:16px;font-size:14px;line-height:1.7;}
.bot .bubble{background:white;border:1px solid #e2e8f0;border-radius:4px 16px 16px 16px;color:#1e293b;}
.user .bubble{background:#6366f1;color:white;border-radius:16px 4px 16px 16px;}

.bubble .sources{margin-top:10px;padding-top:8px;border-top:1px solid #e2e8f0;}
.source-tag{display:inline-block;background:#f1f5f9;color:#6366f1;font-size:11px;padding:2px 8px;border-radius:10px;margin:2px 3px 0 0;border:1px solid #e0e7ff;}

.typing span{width:7px;height:7px;background:#94a3b8;border-radius:50%;animation:bounce .9s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}

.pipeline-strip{background:#f8fafc;border-top:1px solid #e2e8f0;padding:8px 20px;font-size:11px;color:#94a3b8;min-height:30px;}

.step.done{background:#dcfce7;color:#166534;}
.step.active{background:#dbeafe;color:#1d4ed8;animation:blink .8s infinite;}

.ctx-rank{font-size:10px;color:#6366f1;font-weight:700;margin-bottom:3px;}

.ctx-bar{background:#e2e8f0;border-radius:3px;height:3px;margin-top:5px;}
.ctx-fill{height:3px;border-radius:3px;background:#6366f1;}
.ctx-stats{border-top:1px solid #e2e8f0;padding:10px 16px;font-size:11px;color:#94a3b8;}

<script>
const EMOTIONAL = ['화나','짜증','열받','고소','빡','어이없','황당','말이되','해결 안','답답'];
const FORBIDDEN = ['몰라요','안 됩니다','고객님 책임','환불 절대 불가','법대로'];

let kb = [];
let isBusy = false;

function loadKB(){
  const saved = localStorage.getItem('rag_kb');
  kb = saved ? JSON.parse(saved) : [];
  if(!kb.length){
    kb = [
      {id:'doc1',name:'환불·반품 정책',content:`전자상거래법에 따라 상품 수령 후 7일 이내 단순 변심 환불이 가능합니다. 단, 사용 흔적이 있거나 포장 훼손 시에는 환불이 제한될 수 있습니다. 주문 취소는 발송 전까지 가능하며 발송 후에는 반품 절차를 따릅니다. 환불 처리 기간은 반품 확인 후 영업일 기준 3~5일 소요됩니다. 디지털 콘텐츠는 다운로드 이후 환불이 불가합니다. 불량품은 수령 후 30일 이내 교환 또는 환불 가능합니다.`},
      {id:'doc2',name:'배송 정책',content:`일반 배송은 주문 확인 후 평균 1~3 영업일 소요됩니다. 당일 배송은 오전 10시 이전 주문 건에 한해 수도권 지역에서 가능합니다. 배송비는 3만 원 이상 구매 시 무료이며 미만 시 3,000원이 부과됩니다. 제주 및 도서산간 지역은 추가 배송비 3,000원이 부과됩니다. 송장번호는 발송 완료 후 문자 및 앱 푸시로 안내됩니다. 분실 또는 파손 시 택배사와 협의 후 처리합니다.`},
      {id:'doc3',name:'회원 등급 정책',content:`회원 등급은 일반, 실버, 골드, VIP 4단계로 구분됩니다. 실버는 연간 구매액 30만 원 이상, 골드는 100만 원 이상, VIP는 300만 원 이상입니다. VIP 회원은 전담 상담사가 배정되며 우선 처리가 적용됩니다. 등급 산정 기준은 매년 1월 1일 갱신됩니다. 포인트는 구매금액의 1~5%가 적립되며 등급에 따라 배율이 다릅니다.`},
      {id:'doc4',name:'결제 정책',content:`신용카드, 체크카드, 계좌이체, 가상계좌, 카카오페이, 네이버페이, 토스를 지원합니다. 할부는 5만 원 이상 결제 시 최대 12개월까지 가능합니다. 무이자 할부는 카드사별 행사에 따라 제공됩니다. 결제 오류 발생 시 고객센터 또는 결제 취소 후 재시도를 권장합니다. 이중 결제 확인 시 즉시 환불 처리됩니다.`},
      {id:'doc5',name:'A/S 및 품질보증',content:`제품 구매 후 1년간 무상 A/S를 제공합니다. 소비자 과실로 인한 파손은 유상 수리 대상입니다. A/S 접수는 고객센터 전화, 앱, 이메일을 통해 가능합니다. 수리 기간은 접수 후 평균 5~7 영업일 소요됩니다. 부품 수급이 어려운 경우 동급 제품으로 교환합니다. 방문 수리 서비스는 수도권 한정으로 운영됩니다.`},
      {id:'doc6',name:'개인정보 처리방침',content:`수집 항목은 이름, 이메일, 전화번호, 배송지 주소입니다. 수집 목적은 주문 처리, 배송, 고객 서비스, 마케팅(동의 시)입니다. 보유 기간은 회원 탈퇴 후 3년입니다. 제3자 제공은 배송사, 결제사에 한하며 최소 항목만 제공됩니다. 개인정보 열람, 정정, 삭제 요청은 고객센터를 통해 가능합니다.`},
      {id:'doc7',name:'고객센터 운영 안내',content:`고객센터는 평일 오전 9시부터 오후 6시까지 운영됩니다. 주말 및 공휴일은 AI 챗봇이 24시간 응대합니다. 복잡한 문의나 감정 격화 시 즉시 담당 상담사로 연결됩니다. 평균 대기 시간은 평일 기준 3분 이내입니다. VIP 고객은 전용 직통 번호를 이용하실 수 있습니다.`},
    ];
  }
  updateCtxStats();
}

function tokenize(text){
  const tokens={};
  text.replace(/[^\w가-힣]/g,' ').split(/\s+/).filter(w=>w.length>1).forEach(w=>{tokens[w]=(tokens[w]||0)+1;});
  return tokens;
}

function cosineSim(a,b){
  const keys=new Set([...Object.keys(a),...Object.keys(b)]);
  let dot=0,magA=0,magB=0;
  keys.forEach(k=>{const va=a[k]||0,vb=b[k]||0;dot+=va*vb;magA+=va*va;magB+=vb*vb;});
  if(!magA||!magB) return 0;
  return dot/Math.sqrt(magA*magB);
}

function getChunks(text){
  const chunks=[];
  const size=120, step=100;
  for(let i=0;i<text.length;i+=step){
    const c=text.slice(i,i+size);
    if(c.trim()) chunks.push(c);
    if(i+size>=text.length) break;
  }
  return chunks;
}

function ragRetrieve(query){
  const qTokens=tokenize(query);
  const results=[];
  kb.forEach(doc=>{
    getChunks(doc.content).forEach((chunk,i)=>{
      const score=cosineSim(qTokens,tokenize(chunk));
      if(score>0) results.push({doc:doc.name,text:chunk,score,idx:i});
    });
  });
  results.sort((a,b)=>b.score-a.score);
  return results.slice(0,3);
}

function generateAnswer(query, chunks){
  const isEmotional = EMOTIONAL.some(k=>query.includes(k));
  if(isEmotional){
    return {
      text:`많이 불편하셨겠습니다. 진심으로 사과드립니다.<br><br>담당 상담사가 즉시 연결될 수 있도록 처리하겠습니다. 잠시만 기다려 주시면 빠르게 해결해 드리겠습니다.`,
      sources:[], escalate:true
    };
  }

  if(!chunks.length){
    return {
      text:`문의하신 내용을 정확히 파악하지 못했습니다.<br><br>보다 구체적으로 말씀해 주시면 정확한 정책 정보를 안내드릴 수 있습니다. 또는 고객센터(평일 9~18시)로 연결해 드릴까요?`,
      sources:[], escalate:false
    };
  }

  const context = chunks.map(c=>c.text).join(' ');
  let answer = '';

  if(query.includes('환불')||query.includes('반품')){
    if(context.includes('7일')) answer = `전자상거래법 기준으로 상품 수령 후 <strong>7일 이내</strong> 단순 변심 환불이 가능합니다.<br><br>단, 사용 흔적이나 포장 훼손 시 제한될 수 있으며 디지털 콘텐츠는 다운로드 이후 환불이 불가합니다.<br>환불 처리는 반품 확인 후 <strong>영업일 기준 3~5일</strong> 소요됩니다.`;
    else answer = `환불 관련 문의입니다. 구체적인 상황(주문번호, 수령일 등)을 알려주시면 더 정확한 안내가 가능합니다.`;
  } else if(query.includes('배송')){
    answer = `일반 배송은 주문 확인 후 평균 <strong>1~3 영업일</strong> 소요됩니다.<br><br>3만 원 이상 구매 시 배송비 무료이며, 제주·도서산간은 추가 3,000원이 부과됩니다.<br>송장번호는 발송 후 문자/앱으로 안내됩니다.`;
  } else if(query.includes('결제')||query.includes('할부')||query.includes('카드')){
    answer = `카드, 계좌이체, 카카오페이, 네이버페이, 토스 등을 지원합니다.<br><br><strong>5만 원 이상</strong> 결제 시 최대 12개월 할부 가능하며, 카드사별 무이자 행사가 적용될 수 있습니다.`;
  } else if(query.includes('회원')||query.includes('등급')||query.includes('VIP')||query.includes('포인트')){
    answer = `회원 등급은 <strong>일반 → 실버 → 골드 → VIP</strong> 4단계입니다.<br><br>VIP는 연간 구매액 300만 원 이상이며 전담 상담사가 배정됩니다. 포인트는 구매금액의 1~5% 적립됩니다.`;
  } else if(query.includes('A/S')||query.includes('수리')||query.includes('고장')){
    answer = `구매 후 <strong>1년간 무상 A/S</strong>를 제공합니다.<br><br>소비자 과실 파손은 유상 수리이며, 수리 기간은 평균 5~7 영업일 소요됩니다. 부품 수급 불가 시 동급 제품으로 교환합니다.`;
  } else if(query.includes('개인정보')||query.includes('정보')){
    answer = `수집 항목은 이름, 이메일, 전화번호, 배송지입니다.<br><br>회원 탈퇴 후 3년간 보유하며, 배송사·결제사 외 제3자 제공은 없습니다. 열람·삭제 요청은 고객센터를 통해 가능합니다.`;
  } else {
    const firstChunk = chunks[0].text;
    answer = `내부 정책 기반으로 안내드립니다.<br><br>${firstChunk}<br><br>추가로 궁금하신 사항이 있으면 말씀해 주세요.`;
  }

  return {
    text: answer,
    sources: [...new Set(chunks.map(c=>c.doc))],
    escalate: false
  };
}

async function sendMessage(){
  if(isBusy) return;
  const input = document.getElementById('userInput');
  const query = input.value.trim();
  if(!query) return;

  input.value='';
  isBusy=true;
  document.getElementById('sendBtn').disabled=true;

  appendMsg(query, 'user');
  loadKB();

  // Pipeline animation
  await pipeline([
    {label:'감정 탐지', delay:150},
    {label:'금기어 검사', delay:150},
    {label:'RAG 검색', delay:300},
    {label:'컨텍스트 구성', delay:150},
    {label:'응답 생성', delay:300},
    {label:'환각 검증', delay:150},
    {label:'컴플라이언스', delay:100},
  ]);

  const chunks = ragRetrieve(query);
  showContext(query, chunks);

  const {text, sources, escalate} = generateAnswer(query, chunks);

  removeTyping();
  appendBotMsg(text, sources, escalate);
  resetPipeline();

  isBusy=false;
  document.getElementById('sendBtn').disabled=false;
  input.focus();
}

async function pipeline(steps){
  const strip = document.getElementById('pipelineStrip');
  appendTyping();
  for(let i=0;i<steps.length;i++){
    const s=steps[i];
    const active = strip.querySelectorAll('.step.active');
    active.forEach(e=>{e.classList.remove('active');e.classList.add('done');});
    const span=document.createElement('span');
    span.className='step active';
    span.textContent=s.label+'...';
    strip.appendChild(span);
    await sleep(s.delay);
  }
}

function resetPipeline(){
  const strip=document.getElementById('pipelineStrip');
  strip.innerHTML='<span class="step done">완료</span>';
}

function appendTyping(){
  const msgs=document.getElementById('messages');
  const d=document.createElement('div');
  d.className='msg bot';d.id='typing';
  d.innerHTML='<div class="avatar">🤖</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function removeTyping(){
  const t=document.getElementById('typing');
  if(t) t.remove();
}

function appendMsg(text, sender){
  const msgs=document.getElementById('messages');
  const d=document.createElement('div');
  d.className=`msg ${sender}`;
  const avatar=sender==='user'?'👤':'🤖';
  d.innerHTML=`<div class="avatar">${avatar}</div><div class="bubble">${escHtml(text)}</div>`;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function appendBotMsg(text, sources, escalate){
  const msgs=document.getElementById('messages');
  const d=document.createElement('div');
  d.className='msg bot';
  let srcHtml='';
  if(sources && sources.length){
    srcHtml=`<div class="sources">📎 출처: ${sources.map(s=>`<span class="source-tag">${s}</span>`).join('')}</div>`;
  }
  if(escalate){
    srcHtml=`<div class="sources" style="color:#ef4444;">⚠️ 담당자 연결 중...</div>`;
  }
  d.innerHTML=`<div class="avatar">🤖</div><div class="bubble">${text}${srcHtml}</div>`;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function showContext(query, chunks){
  const body=document.getElementById('ctxBody');
  document.getElementById('statQuery').textContent=query.slice(0,12)+(query.length>12?'…':'');
  if(!chunks.length){
    body.innerHTML='<div class="ctx-empty">관련 청크 없음</div>';
    return;
  }
  body.innerHTML=chunks.map((c,i)=>`
    <div class="ctx-chunk">
      <div class="ctx-rank">#${i+1} · ${(c.score*100).toFixed(1)}%</div>
      <div class="ctx-doc">${c.doc}</div>
      <div class="ctx-text">${escHtml(c.text)}</div>
      <div class="ctx-bar"><div class="ctx-fill" style="width:${Math.min(100,(c.score*100).toFixed(0))}%"></div></div>
    </div>
  `).join('');
}

function updateCtxStats(){
  const totalChunks=kb.reduce((s,d)=>s+getChunks(d.content).length,0);
  document.getElementById('statDocs').textContent=kb.length;
  document.getElementById('statChunks').textContent=totalChunks;
}

function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

document.getElementById('userInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}});

loadKB();
</script>
</body>
</html>
